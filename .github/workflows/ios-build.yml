name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Xcode 26 / iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project YUI.xcodeproj \
            -scheme YUI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Capture simulator screenshots (light / dark)
        continue-on-error: true
        run: bash Scripts/ci-capture-screenshots.sh

      - name: Capture app icon appearance
        continue-on-error: true
        run: bash Scripts/ci-capture-icon.sh

      - name: Run UI tests (interaction verification)
        run: bash Scripts/ci-run-ui-tests.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: artifacts/
          if-no-files-found: warn

      - name: Build unsigned Release IPA
        run: bash Scripts/ci-build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: |
            artifacts/YUI-unsigned.ipa
            artifacts/ipa-build.log
            artifacts/ipa-contents.txt
            artifacts/ipa-executable.txt
            artifacts/ipa-info.txt
            artifacts/ipa-bundle.txt
            artifacts/ipa-assets.json
            artifacts/ipa-assets-grep.txt
            artifacts/ipa-size.txt
            artifacts/icon/
          if-no-files-found: warn
