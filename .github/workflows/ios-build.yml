name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Xcode 26 / iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project YUI.xcodeproj \
            -scheme YUI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # 可选证据：启动模拟器、安装并各截一张浅色/深色图。
      # 只采集视觉证据，不验证交互逻辑，也不代表通过了人工视觉验收。
      - name: Capture simulator screenshots (light / dark)
        continue-on-error: true
        run: bash Scripts/ci-capture-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: artifacts/
          if-no-files-found: warn
